name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: python -m ruff check backend

      - name: Run Ruff Format Check
        run: python -m ruff format --check backend

      - name: Bytecode compilation check
        run: python -m compileall backend

  test:
    name: Unit & Integration Tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ages_art_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ages_art_test_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ages_art_test_db
      AI_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      CRM_PROVIDER: mock
      WHATSAPP_PROVIDER: mock

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify single Alembic head
        run: |
          python -m alembic heads

      - name: Run Alembic migrations on test database
        run: |
          python -m alembic upgrade head

      - name: Run full test suite (unit and PostgreSQL/pgvector integration)
        run: |
          python -m pytest backend/tests -v

      - name: Evaluate offline inquiry contracts
        run: python backend/app/scripts/evaluate.py --output artifacts/evaluation
